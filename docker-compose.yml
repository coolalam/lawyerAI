services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    image: lawyer-ai-backend:latest
    container_name: lawyer-ai-backend
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    environment:
      LAW_DATA_DIR: /app/data
      LAW_DB_PATH: /app/data/jw-db-records-20261113.sqlite3
      LAW_PORT: "8000"
      LAW_ALLOWED_ORIGINS: ${LAW_ALLOWED_ORIGINS:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      start_period: 10m
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx-frontend
    image: lawyer-ai-frontend:latest
    container_name: lawyer-ai-frontend
    restart: unless-stopped
    init: true
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
